name: Validate Workflow & Sample JSON
on: [push, pull_request]
jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -c "import json, glob; files = glob.glob('**/*.json', recursive=True); [json.load(open(f, encoding='utf-8')) for f in files]; print(f'Validated {len(files)} JSON files.')"